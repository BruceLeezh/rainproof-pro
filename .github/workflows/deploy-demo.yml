# 把 05-演示站点/ 发布成可公开访问的演示链接（GitHub Pages）。
#
# 为什么需要它：手册 5.2 的演示材料要求「演示视频 **或** 可运行链接」，5.3 的提交前检查要求
# 「链接可访问」。演示页依赖 MetaMask 注入，file:// 打不开；localhost 只有我们自己的机器能开。
# 所以用 Pages 给评委一个真的能点开的地址：https://<owner>.github.io/rainproof-pro/
#
# 只有一个来源：05-演示站点/ —— 不要往这里手动搬副本，否则会和仓库里的真页面对不上。
name: Deploy demo site

on:
  push:
    branches: [main, v6]
    paths:
      - '05-演示站点/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        # 注：不能用 enablement: true 自开通——该选项明确要求 GITHUB_TOKEN 以外的
        # token（PAT 或 GitHub App），GITHUB_TOKEN 会被拒。Pages 已于 2026-11-02
        # 在 Settings 手动开通，github-pages 环境分支策略已放行 v6。
      - name: 构建保险创业赛默认入口并保留历史页
        run: node 07-测试工具/build-site.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - id: deployment
        uses: actions/deploy-pages@v4
